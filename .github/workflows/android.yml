name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-release:
    name: Build Release Split APKs
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode Release Keystore
        env:
          RELEASE_STORE_FILE_BASE64: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_STORE_FILE_BASE64" ] || [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Missing release signing secrets. Ensure RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD are configured."
            exit 1
          fi
          printf '%s' "$RELEASE_STORE_FILE_BASE64" | tr -d '[:space:]' | base64 --decode > "${{ github.workspace }}/app/release.jks"
          if [ ! -s "${{ github.workspace }}/app/release.jks" ]; then
            echo "::error::Decoded release.jks is empty."
            exit 1
          fi

      - name: Build Signed Release Split APKs
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/app/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify Release APK Signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              "$APKSIGNER" verify --print-certs "$apk"
            done
          fi

      - name: Clean up Release Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/app/release.jks"

      - name: Upload Release Split APKs
        uses: actions/upload-artifact@v4
        with:
          name: aria-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
